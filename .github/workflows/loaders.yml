name: Package loader targets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - name: Read authoritative target matrix
        id: targets
        run: |
          python3 - <<'PY'
          import json, os
          with open('platform-adapters/minecraft/targets.json', encoding='utf-8') as source:
              targets = sorted(json.load(source))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('targets=' + json.dumps(targets) + '\n')
          PY
  package:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and package selected target
        env:
          OVERHAUL_TARGET: ${{ matrix.target }}
        run: ./gradlew -p platform-adapters/minecraft "-Ptarget=$OVERHAUL_TARGET" build --no-daemon --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: overhaul-${{ matrix.target }}
          path: platform-adapters/minecraft/build/${{ matrix.target }}/libs/*.jar
          if-no-files-found: error
