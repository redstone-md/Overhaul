name: Package loader targets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fabric-1.16.5
          - fabric-1.20.1
          - fabric-1.21.1
          - fabric-26.3
          - forge-1.12.2
          - forge-1.16.5
          - forge-1.20.1
          - neoforge-1.21.1
          - neoforge-26.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and package selected target
        run: ./gradlew -p platform-adapters/minecraft -Ptarget=${{ matrix.target }} build --no-daemon --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: overhaul-${{ matrix.target }}
          path: platform-adapters/minecraft/build/${{ matrix.target }}/libs/*.jar
          if-no-files-found: error
