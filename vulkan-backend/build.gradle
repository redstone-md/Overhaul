description = 'Explicit Vulkan rendering and native resource ownership.'

def natives = rootProject.lwjglNatives

dependencies {
    api project(':core-common')
    api project(':shader-pipeline')
    api platform("org.lwjgl:lwjgl-bom:${property('lwjglVersion')}")
    api 'org.lwjgl:lwjgl'
    api 'org.lwjgl:lwjgl-vulkan'
    api 'org.lwjgl:lwjgl-vma'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-shaderc'
    runtimeOnly "org.lwjgl:lwjgl::${natives}"
    runtimeOnly "org.lwjgl:lwjgl-glfw::${natives}"
    runtimeOnly "org.lwjgl:lwjgl-vma::${natives}"
    runtimeOnly "org.lwjgl:lwjgl-shaderc::${natives}"
    if (rootProject.nativeOs == 'macos') {
        runtimeOnly "org.lwjgl:lwjgl-vulkan::${natives}"
    }
}

tasks.register('vulkanSmoke', JavaExec) {
    group = 'verification'
    description = 'Runs opt-in Vulkan device, transfer and draw/readback validation.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.overhaul.vulkan.VulkanSmoke'
}

// Minecraft 26.3 uses SDL3 and newer LWJGL bindings. Keep its native runtime
// isolated: mixing these bindings with the default 3.3.6 native jars is invalid.
sourceSets {
    sdlAdapter {
        java.srcDir 'src/sdl/java'
        java.include 'dev/overhaul/vulkan/SdlSurfaceProvider.java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    sdlSmoke {
        java.srcDir 'src/sdl/java'
        java.exclude 'dev/overhaul/vulkan/SdlSurfaceProvider.java'
        compileClasspath += sourceSets.main.output + sourceSets.sdlAdapter.output
        runtimeClasspath += sourceSets.main.output + sourceSets.sdlAdapter.output
    }
}

configurations {
    sdlSmokeImplementation.extendsFrom(sdlAdapterImplementation)
    sdlSmokeRuntimeOnly.extendsFrom(sdlAdapterRuntimeOnly)
}

dependencies {
    sdlAdapterImplementation project(':core-common')
    sdlAdapterImplementation(project(':shader-pipeline')) { transitive = false }
    sdlAdapterImplementation platform('org.lwjgl:lwjgl-bom:3.4.3')
    ['lwjgl', 'lwjgl-vulkan', 'lwjgl-sdl', 'lwjgl-vma', 'lwjgl-shaderc'].each {
        sdlAdapterImplementation "org.lwjgl:${it}"
    }
    ['lwjgl', 'lwjgl-sdl', 'lwjgl-vma', 'lwjgl-shaderc'].each {
        sdlAdapterRuntimeOnly "org.lwjgl:${it}::${natives}"
    }
    if (rootProject.nativeOs == 'macos') {
        sdlAdapterRuntimeOnly "org.lwjgl:lwjgl-vulkan::${natives}"
    }
}

tasks.register('sdlVulkanSmoke', JavaExec) {
    group = 'verification'
    description = 'Runs the Vulkan surface/render path on an isolated SDL3/LWJGL 3.4.3 runtime.'
    classpath = sourceSets.sdlSmoke.runtimeClasspath
    mainClass = 'dev.overhaul.vulkan.sdl.SdlVulkanSmoke'
}

tasks.register('sdlAdapterJar', Jar) {
    description = 'Packages the SDL3 surface provider separately from the default LWJGL runtime.'
    archiveClassifier = 'sdl34'
    from sourceSets.sdlAdapter.output
}

tasks.named('assemble') { dependsOn 'sdlAdapterJar' }
