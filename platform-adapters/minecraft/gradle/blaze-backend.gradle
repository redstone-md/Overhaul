// Keep the renderer shared; only the game's mesh/upload boundary varies by tier.
def tiers = [
        '1.20.1': [source: 'blaze120', lwjgl: '3.3.1', java: 17,
                   loaders: ['fabric', 'forge'], uploadMixin: 'VertexBufferUpload120Mixin',
                   tierMixins: ['LevelRendererChunkInfo120Access', 'LevelRendererSectionBatch120Mixin',
                                'CompiledContents120Mixin', 'RenderChunkBuffers120Mixin', 'ChunkPublish120Mixin', 'RebuildPublish120Mixin',
                                'LevelRendererShaderPack120Mixin', 'GameRendererHand120Access', 'GameRendererPackHand120Mixin', 'GameRendererPackBobbing120Mixin',
                                'OptionsSubScreen120Access',
                               'LevelRendererEntityOcclusion120Mixin', 'LevelRendererBlockEntityOcclusion120Mixin',
                               'LevelRendererSections120Mixin']],
        '1.21.1': [source: 'blaze121', lwjgl: '3.3.3', java: 21,
                   loaders: ['fabric', 'forge', 'neoforge'], uploadMixin: 'VertexBufferUpload121Mixin',
                   loaderMixins: [neoforge: ['WindowEarlyHandoff121Mixin', 'MinecraftEarlyOverlay121Mixin', 'ClientModLoaderEarlyTick121Mixin', 'BornInChaosAnimationTick121Mixin']],
                   tierMixins: [
                                'VeilCompiledProgram121Mixin', 'VeilShaderCompiler121Mixin', 'LodestoneProgram121Mixin', 'VeilCompiledShader121Mixin', 'VeilShaderSource121Access',
                                'VeilUniformCache121Mixin', 'VeilShaderProgram121Mixin', 'VeilUniform121Access', 'VeilTextureCache121Access',
                                'VeilScreenQuad121Mixin', 'VeilPatchState121Mixin', 'GlStateProgram121Mixin', 'ShaderInstanceProgram121Access', 'EffectInstanceProgram121Access',
                                'LevelEntityClasses121Mixin', 'EntitySectionManagerClasses121Mixin', 'EntityLight121Mixin', 'EntityDispatcherLight121Mixin', 'EntitySelectorAlive121Mixin', 'ServerEntityClasses121Mixin', 'EntitySectionLookup121Mixin', 'EntityCollisions121Mixin', 'LevelEntities121Access', 'DamageTextSight121Mixin', 'ParticleSableMove121Mixin', 'LevelRendererSableRain121Mixin', 'EntityRendererSableCull121Mixin', 'WitherGlowScan121Mixin', 'WitherMusicScan121Mixin', 'LevelRendererVeilSkeletons121Mixin', 'HamsterFeverWalk121Mixin', 'AlexsMobsEffectPoses121Mixin', 'VillagerLayerTextures121Mixin', 'AtmosphereWeatherProxies121Mixin', 'AtmosphereLocalWeather121Access', 'MoveToBlockSearch121Mixin', 'RemoveBlockGoalAccess121Mixin', 'LevelRendererRainBiomes121Mixin', 'ParticleLight121Mixin', 'ParticleCollisions121Mixin', 'LevelRendererRainLight121Mixin', 'LevelHeight121Mixin', 'EntityBlockCollisions121Mixin', 'EntitySupportingBlock121Mixin', 'EntityTagCounts121Mixin', 'EntitySelectorParserTags121Mixin', 'EntitySelectorTags121Mixin', 'EntitySelectorIndex121Mixin', 'EntityLookupIndex121Mixin', 'ServerLevelEntityManager121Access', 'PersistentEntityLookup121Access', 'AttributeOperations121Mixin', 'ServerEventListeners121Mixin', 'CommandSourceNames121Mixin', 'AlexsMobsPupfishSave121Mixin',
                                'LevelRendererSections121Mixin', 'LevelRendererDhFade121Mixin', 'ViewAreaColumns121Mixin', 'DhRenderList121Mixin',
                                'BufferBuilderParticles121Mixin', 'ParticleQuads121Mixin', 'CompiledContents121Mixin',
                                'ClientLevelBiomes121Mixin', 'FogRendererBiomes121Mixin',
                                'EntityTypeRenderer121Mixin', 'EntityRendererLookup121Mixin',
                                'ModelCube121Mixin', 'BufferBuilderBulk121Mixin', 'ItemQuads121Mixin',
                                'XaeroMapWriter121Mixin', 'XaeroMapProcessor121Mixin', 'ShoulderCrosshair121Mixin', 'SectionOcclusionFrustum121Mixin', 'RenderSectionOrigin121Mixin', 'Frustum121Accessor', 'CataclysmScans121Mixin', 'AlexsCavesScans121Mixin', 'YoukaiHeadCurios121Mixin', 'DhClouds121Mixin', 'XaeroRadar121Mixin', 'RendererRegistration121Mixin', 'BlockEntityRendererRegistration121Mixin', 'RenderSectionBuffers121Mixin',
                                'LevelRendererShaderPack121Mixin','GameRendererHand121Access', 'GameRendererPackHand121Mixin', 'GameRendererPackBobbing121Mixin',
                                'OptionsSubScreen121Access',
                                'LevelRendererSectionBatch121Mixin',
                                'LevelRendererEntityOcclusion121Mixin',
                                'LevelRendererBlockEntityOcclusion121Mixin',
                                'SectionRenderDispatcherCompact121Mixin',
                                'BufferBuilderBlockIds121Mixin', 'SectionCompilerBlockIds121Mixin']]
]
ext.blazeTarget = tiers[target.minecraft]
if (blazeTarget == null || !blazeTarget.loaders.contains(target.loader)) {
    throw new GradleException('The Blaze3D frontend requires a pinned Fabric/Forge 1.20.1 or Fabric/Forge/NeoForge 1.21.1 target')
}
if ((target.java as int) != blazeTarget.java) throw new GradleException('Blaze3D target Java version does not match its game tier')
sourceSets.main.java.srcDir 'src/blazeBackend/java'
sourceSets.main.java.srcDir "src/${blazeTarget.source}/java"
// What a loader patches into the game (biome modifiers, its own loading screen) lives beside the tier, per loader.
def blazeLoaderSource = file("src/${blazeTarget.source}${target.loader.capitalize()}/java")
if (blazeLoaderSource.isDirectory()) sourceSets.main.java.srcDir blazeLoaderSource
ext.blazeMixinNames = blazeTarget.tierMixins + ((blazeTarget.loaderMixins ?: [:])[target.loader] ?: [])
sourceSets.main.resources.srcDir 'src/blazeBackend/resources'
// Sodium and Distant Horizons are optional at runtime; their classes are compile-time stubs for @Pseudo mixins and are never packaged.
sourceSets.create('blazeSodiumStubs') { java.srcDirs = ['src/blazeSodiumStubs/java'] }
dependencies {
    blazeSodiumStubsCompileOnly 'org.joml:joml:1.10.5'
    compileOnly sourceSets.blazeSodiumStubs.output
}
tasks.named('processResources') {
    inputs.properties(blazeMinecraft: target.minecraft, blazeJava: target.java,
            blazeUploadMixin: blazeTarget.uploadMixin, blazeTierMixins: blazeMixinNames.join(','))
    filesMatching('overhaul.blaze.mixins.json') {
        expand(compatibility: "JAVA_${target.java}")
    }
}
apply from: 'gradle/blaze-runtime.gradle'
// A pack profile owns its game directory and must already disable the FML early window.
if (target.loader in ['forge', 'neoforge'] && !providers.gradleProperty('packProfile').isPresent()) apply from: 'gradle/blaze-client-profile.gradle'
dependencies { implementation blazeRuntimeJars }
tasks.withType(JavaExec).configureEach {
    if (providers.gradleProperty('blazeStats').isPresent()) systemProperty 'overhaul.blaze.stats', 'true'
}
