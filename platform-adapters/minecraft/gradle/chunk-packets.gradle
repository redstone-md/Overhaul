// Only the receive codec and synchronous application hooks vary between pinned tiers.
def packetTiers = ['1.20.1': [source: 'packets120', suffix: '120'],
                   '1.21.1': [source: 'packets121', suffix: ''],
                   '26.3': [source: 'packets263', suffix: '263']]
def packetTier = packetTiers[target.minecraft]
if (packetTier == null) throw new GradleException('No packet codec adapter for selected game version')
sourceSets.main.java.srcDirs += ['src/chunkPackets/java', "src/${packetTier.source}/java"]
if (target.minecraft in ['1.20.1', '1.21.1']) sourceSets.main.java.srcDir 'src/statePackets/java'
sourceSets.main.resources.srcDir 'src/chunkPackets/resources'
def packetMixins = 'overhaul.chunk-packets.mixins.json'
overhaulMixinConfigs.add(packetMixins)
tasks.named('processResources') {
    inputs.property('chunkPacketVersion', target.minecraft)
    inputs.property('chunkPacketLoader', target.loader)
    filesMatching(packetMixins) {
        expand(compatibility: "JAVA_${target.java}", connectionMixin: "ConnectionChunkPacket${packetTier.suffix}Mixin",
                decoderMixin: "ChunkPacketDecoder${packetTier.suffix}Mixin", dataMixin: "ChunkPacketData${packetTier.suffix}Mixin",
                applyMixin: "ChunkPacketApply${packetTier.suffix}Mixin")
        if (target.loader != 'forge') filter { line -> line.contains('"refmap"') ? null : line }
    }
    doLast {
        if (target.minecraft in ['1.20.1', '1.21.1']) {
            def mixins = new File(destinationDir, packetMixins)
            def config = new groovy.json.JsonSlurper().parse(mixins)
            def stateMixins = ['IdMapperSnapshotMixin', 'SectionBlockUpdatesMixin']
            if (target.loader == 'neoforge') stateMixins += 'NeoForgeIdMapperClearMixin'
            if (target.loader == 'forge') stateMixins += 'ForgeIdMapperMutationMixin'
            config.mixins = ((config.mixins ?: []) + stateMixins).unique()
            mixins.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config)), 'UTF-8')
        }
        if (target.loader == 'fabric') {
            def metadata = new File(destinationDir, 'fabric.mod.json')
            def config = new groovy.json.JsonSlurper().parse(metadata)
            config.mixins = ((config.mixins ?: []) + packetMixins).unique()
            metadata.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config)), 'UTF-8')
        } else if (target.loader == 'neoforge') {
            def metadata = new File(destinationDir, 'META-INF/neoforge.mods.toml')
            if (!metadata.getText('UTF-8').contains('config="' + packetMixins + '"')) {
                metadata.append('\n[[mixins]]\nconfig="' + packetMixins + '"\n', 'UTF-8')
            }
        }
    }
}
