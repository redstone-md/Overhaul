ext.targetName = providers.gradleProperty('target').getOrElse('fabric-26.3')
ext.target = new groovy.json.JsonSlurper().parse(file('targets.json'))[targetName]
ext.set('loom.platform', target.loader)
def sectionQueries = ['1.20.1', '1.21.1', '26.3'].contains(target.minecraft)
def chunkGeneration = ['1.20.1', '1.21.1', '26.3'].contains(target.minecraft)
def mappedGeneration = ['1.20.1', '1.21.1'].contains(target.minecraft)
group = 'dev.overhaul'
def sharedProperties = new Properties()
file('../../gradle.properties').withInputStream { sharedProperties.load(it) }
version = providers.gradleProperty('modVersion').getOrElse(sharedProperties.getProperty('modVersion'))
if (!version || version == 'unspecified') throw new GradleException('The root modVersion is required')
def worldSmoke = providers.gradleProperty('worldSmoke').isPresent()
def modelSmoke = providers.gradleProperty('modelSmoke').isPresent()
def overhaulBackend = providers.gradleProperty('overhaulBackend').isPresent()
def blazeBackend = providers.gradleProperty('blazeBackend').isPresent()
if (blazeBackend && overhaulBackend) throw new GradleException('Select one owned renderer frontend')
def querySmoke = providers.gradleProperty('querySmoke').isPresent()
if (modelSmoke && !worldSmoke) throw new GradleException('Model smoke requires -PworldSmoke')
if (querySmoke && (!worldSmoke || modelSmoke || overhaulBackend)) throw new GradleException('Query smoke requires only -PworldSmoke -PquerySmoke')
layout.buildDirectory = file("build/${targetName}${worldSmoke ? '-world-smoke' : ''}${modelSmoke ? '-model' : ''}${overhaulBackend ? '-backend' : ''}${querySmoke ? '-queries' : ''}${blazeBackend ? '-blaze' : ''}")

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven { url = 'https://libraries.minecraft.net/' }
}

apply plugin: 'java'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = target.java as int
}
sourceSets.main.java.srcDirs = ['../src/main/java', '../../core-common/src/main/java']
if (target.tier != 'legacy') {
    sourceSets.main.java.srcDir 'src/common/java'
    sourceSets.main.java.srcDir "src/${target.loader}/java"
    sourceSets.main.java.srcDir target.minecraft == '26.3' ? 'src/unobfuscated/java' : 'src/mapped/java'
    if (sectionQueries) sourceSets.main.java.srcDir 'src/sectionQueries/java'
    if (chunkGeneration) sourceSets.main.java.srcDir 'src/chunkGeneration/java'
    if (chunkGeneration) sourceSets.main.java.srcDir 'src/chunkLighting/java'
    if (mappedGeneration) sourceSets.main.java.srcDir 'src/generationMapped/java'
    if (target.minecraft == '1.20.1') sourceSets.main.java.srcDir 'src/generation120/java'
    if (target.minecraft == '1.21.1') sourceSets.main.java.srcDir 'src/generation121/java'
    if (providers.gradleProperty('worldSmoke').isPresent()) {
        if (targetName != 'fabric-26.3') throw new GradleException('World smoke currently requires fabric-26.3')
        sourceSets.main.java.srcDir 'src/worldSmoke/java'
        sourceSets.main.java.srcDir modelSmoke ? 'src/modelSmoke/java' :
                overhaulBackend ? 'src/backendWorldSmoke/java' : querySmoke ? 'src/querySmoke/java' : 'src/noModelSmoke/java'
    } else sourceSets.main.java.srcDir 'src/nosmoke/java'
    sourceSets.main.resources.srcDirs = ['src/common/resources', "src/${target.loader}/resources"]
    if (modelSmoke) sourceSets.main.resources.srcDir 'src/modelSmoke/resources'
} else {
    sourceSets.main.java.srcDir 'src/legacy/java'
    sourceSets.main.resources.srcDirs = ['src/legacy/resources']
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
dependencies {
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    if (target.tier != 'legacy') testImplementation 'org.ow2.asm:asm:9.8'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
if (modelSmoke) {
    dependencies {
        implementation files("../../vulkan-backend/build/libs/vulkan-backend-${project.version}.jar",
                "../../shader-pipeline/build/libs/shader-pipeline-${project.version}.jar")
    }
    tasks.withType(JavaExec).configureEach {
        systemProperty 'org.lwjgl.system.stackSize', '1024'
        jvmArgs '--enable-native-access=ALL-UNNAMED'
    }
}
if (target.tier != 'legacy') sourceSets.test.java.srcDirs = ['src/test/java']
if (target.minecraft == '26.3') sourceSets.test.java.srcDir 'src/worldQueryTest/java'
if (target.minecraft == '26.3') {
    tasks.register('queryBenchmark', JavaExec) {
        group = 'verification'
        description = 'Measures interleaved untouched-game and owned section traversals; not an FPS benchmark.'
        dependsOn 'testClasses'
        classpath = files(providers.provider { tasks.named('test').get().classpath })
        mainClass = 'dev.overhaul.minecraft.world.SectionQueryBenchmark'
        args layout.buildDirectory.file('verification/entity-query-benchmark.json').get().asFile.absolutePath
    }
}
if (overhaulBackend) apply from: 'gradle/render-backend.gradle'
if (blazeBackend) apply from: 'gradle/blaze-backend.gradle'
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'overhaul.loader', target.loader
    // ForgeGradle7 exposes main outputs through its jar/variant pipeline.
    dependsOn tasks.named('jar')
    classpath += files(tasks.named('jar').flatMap { it.archiveFile })
    // The descriptor test reads game class files; ModDevGradle omits them from default test runtime.
    classpath += sourceSets.main.compileClasspath
}
tasks.withType(JavaExec).configureEach {
    if (providers.gradleProperty('diagnostics').isPresent() || providers.gradleProperty('smokeClient').isPresent()
            || providers.gradleProperty('worldSmoke').isPresent()) {
        systemProperty 'overhaul.diagnostics.enable', 'true'
    }
    if (providers.gradleProperty('smokeClient').isPresent()) {
        def requested = providers.gradleProperty('smokeClient').get()
        systemProperty 'overhaul.diagnostics.stopAfterTicks', requested.empty ? '200' : requested
    }
    if (providers.gradleProperty('worldSmoke').isPresent()) {
        systemProperty 'overhaul.diagnostics.worldSmoke', 'true'
        systemProperty 'overhaul.diagnostics.expectedRunDirectory', file("run/${targetName}").absolutePath
    }
}

if (providers.gradleProperty('worldSmoke').isPresent()) {
    if (querySmoke) {
        tasks.register('prepareQuerySmoke') {
            doLast { delete file("run/${targetName}/overhaul-entity-query-smoke-latest.json") }
        }
        tasks.named('runClient') { dependsOn 'prepareQuerySmoke' }
    }
    tasks.register('verifyWorldSmoke') {
        group = 'verification'
        description = 'Creates a new disposable world, validates live capture and orderly teardown.'
        dependsOn 'runClient'
        doLast {
            def reportFile = file("run/${targetName}/overhaul-world-smoke-latest.json")
            if (!reportFile.isFile()) throw new GradleException('World smoke produced no receipt')
            def receipt = new groovy.json.JsonSlurper().parse(reportFile)
            if (receipt.status != 'PASS' || receipt.indices <= 0 || receipt.retiredLeases != 0) {
                throw new GradleException("World smoke failed: ${receipt}")
            }
            if (modelSmoke && (!receipt.additionalProbe.contains('bakedModels=true') ||
                    !receipt.additionalProbe.contains('sourceLeases=0') ||
                    !file("run/${targetName}/overhaul-model-smoke/world-model-vulkan.png").isFile())) {
                throw new GradleException('World model smoke did not prove native rendering of captured assets')
            }
            if (querySmoke) {
                def queries = new groovy.json.JsonSlurper().parse(file("run/${targetName}/overhaul-entity-query-smoke-latest.json"))
                def proof = queries.evidence
                if (queries.status != 'PASS' || !queries.disconnected || !proof.cleanupComplete
                        || proof.world != receipt.world || proof.serverThread != 'Server thread'
                        || proof.fixtureStands != 72 || proof.fixtureOccupiedSections != 72 || proof.removedFixtures != 73
                        || proof.ordinaryWorldTicks < 40 || proof.pigTicks < 40 || proof.orderedOracleCases.size() != 21
                        || proof.afterOrdinaryTraffic.queries <= proof.beforeOrdinaryTraffic.queries
                        || proof.finalStatistics.queries <= proof.initialStatistics.queries
                        || proof.finalStatistics.fallbacks <= proof.initialStatistics.fallbacks
                        || proof.finalStatistics.vanillaBypasses <= proof.initialStatistics.vanillaBypasses
                        || !receipt.additionalProbe.contains('entityQueries=ordered-oracle')) {
                    throw new GradleException("Actual server query oracle, traffic or cleanup proof failed: ${queries}")
                }
            }
        }
    }
}
tasks.named('processResources') {
    inputs.properties(version: project.version, minecraft: target.minecraft, loaderVersion: target.loaderVersion)
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'mcmod.info', 'overhaul.mixins.json']) {
        expand(version: project.version, minecraft: target.minecraft, loaderVersion: target.loaderVersion,
                compatibility: "JAVA_${target.java}")
    }
    filesMatching('overhaul.mixins.json') {
        if (target.loader != 'forge' || target.minecraft == '26.3') {
            filter { line -> line.contains('"refmap"') ? null : line }
        }
    }
    if (sectionQueries) doLast {
        def config = new File(destinationDir, 'overhaul.mixins.json')
        def json = new groovy.json.JsonSlurper().parse(config)
        def queryMixins = ['EntitySectionStorageMixin']
        if (chunkGeneration) queryMixins += 'RandomStateGenerationMixin'
        if (mappedGeneration) queryMixins += ['ChunkMapMappedGenerationMixin', 'MinecraftServerMappedGenerationMixin',
                'ChunkMapMappedLightingMixin']
        if (target.minecraft == '1.20.1') queryMixins += ['ChunkBiomeGeneration120Mixin', 'NoiseTerrainGeneration120Mixin',
                'ChunkStatusGeneration120Mixin']
        if (target.minecraft == '1.21.1') queryMixins += ['ChunkBiomeGeneration121Mixin', 'NoiseTerrainGeneration121Mixin']
        if (target.minecraft == '26.3') queryMixins += ['ChunkMapParseMixin', 'MinecraftServerChunkParseMixin', 'ChunkMapLightingMixin',
                'ChunkMapGenerationMixin', 'ChunkBiomeGenerationMixin', 'NoiseTerrainGenerationMixin',
                'NodeEvaluatorMixin']
        json.mixins = (json.mixins + queryMixins).unique()
        config.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
    }
    if (modelSmoke) doLast {
        def metadata = new File(destinationDir, 'fabric.mod.json')
        def json = new groovy.json.JsonSlurper().parse(metadata)
        json.mixins += 'overhaul.model-smoke.mixins.json'
        metadata.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
    }
}
tasks.named('jar') {
    archiveBaseName = "overhaul-${target.loader}-${target.minecraft}"
    if (!worldSmoke) {
        // Older development builds shared this directory. Never package stale
        // development-only classes, even when Gradle's incremental output retains them.
        exclude 'dev/overhaul/minecraft/smoke/**', 'dev/overhaul/minecraft/modelmixin/**',
                'dev/overhaul/minecraft/ModelSmokeFactory.class'
    }
    if (!overhaulBackend) exclude 'dev/overhaul/minecraft/backend/**', 'dev/overhaul/minecraft/backendmixin/**',
            'overhaul.backend.mixins.json'
    if (!blazeBackend) exclude 'dev/overhaul/minecraft/blaze/**', 'overhaul.blaze.mixins.json'
    if (!sectionQueries) exclude 'dev/overhaul/minecraft/world/**',
            'dev/overhaul/minecraft/mixin/EntitySectionStorageMixin.class'
    manifest.attributes('Implementation-Version': project.version, 'Overhaul-Tier': target.tier)
    if (target.loader == 'forge' && target.tier != 'legacy') {
        manifest.attributes('MixinConfigs': 'overhaul.mixins.json')
    }
}

tasks.register('verifyAdapterJar') {
    group = 'verification'
    description = 'Checks packaged adapter metadata, bytecode target, and native isolation.'
}
afterEvaluate {
    def artifactTask = tasks.findByName('remapJar') ?: tasks.named('jar').get()
    tasks.named('verifyAdapterJar') {
        dependsOn artifactTask
        inputs.file artifactTask.archiveFile
        doLast {
            new java.util.jar.JarFile(artifactTask.archiveFile.get().asFile).withCloseable { jar ->
                def entries = jar.entries().toList()
                def forbidden = entries.find { it.name.startsWith('org/lwjgl/') || it.name.startsWith('dev/overhaul/vulkan/') }
                if (forbidden) throw new GradleException("Server-safe adapter bundled native code: ${forbidden.name}")
                if (!worldSmoke && entries.any { it.name.startsWith('dev/overhaul/minecraft/smoke/') }) {
                    throw new GradleException('A normal adapter jar contains development world-creation code')
                }
                def metadata = target.tier == 'legacy' ? 'mcmod.info' : target.loader == 'fabric' ? 'fabric.mod.json' :
                        target.loader == 'neoforge' ? 'META-INF/neoforge.mods.toml' : 'META-INF/mods.toml'
                if (jar.getEntry(metadata) == null) throw new GradleException("Missing ${metadata}")
                if (target.tier != 'legacy') {
                    def mixins
                    jar.getInputStream(jar.getEntry('overhaul.mixins.json')).withCloseable { stream ->
                        mixins = new groovy.json.JsonSlurper().parse(stream)
                    }
                    def prefix = mixins.package.replace('.', '/') + '/'
                    def queryHook = (mixins.mixins ?: []).contains('EntitySectionStorageMixin')
                    def queryClass = jar.getEntry('dev/overhaul/minecraft/world/SectionQueryTraversal.class') != null
                    if (queryHook != (target.minecraft == '26.3') || queryClass != queryHook) {
                        throw new GradleException('Entity section-query implementation is absent or escaped its 26.3 target')
                    }
                    def allowed = ((mixins.mixins ?: []) + (mixins.client ?: []) + (mixins.server ?: []))
                            .collect { prefix + it.replace('.', '/') }
                    def invalid = entries.find { entry -> entry.name.startsWith(prefix) && entry.name.endsWith('.class') &&
                            !allowed.any { type -> entry.name == type + '.class' || entry.name.startsWith(type + '$') } }
                    if (invalid) throw new GradleException("Normal class is inside reserved Mixin package: ${invalid.name}")
                }
                for (entry in entries.findAll { it.name.endsWith('.class') }) {
                    jar.getInputStream(entry).withCloseable { stream ->
                        def data = new DataInputStream(stream)
                        if (data.readInt() != (0xCAFEBABE as int)) throw new GradleException("Invalid class ${entry.name}")
                        data.readUnsignedShort()
                        if (data.readUnsignedShort() > (target.java as int) + 44) {
                            throw new GradleException("Wrong Java bytecode target: ${entry.name}")
                        }
                    }
                }
            }
        }
    }
    tasks.named('check') { dependsOn 'verifyAdapterJar' }
}
