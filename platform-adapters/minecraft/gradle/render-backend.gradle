// Opt-in native backend. Keep bindings supplied by Minecraft 26.3
// separate from the portable backend's default LWJGL runtime.
if (target.minecraft != '26.3' || !['fabric','forge','neoforge'].contains(target.loader)) {
    throw new GradleException('The owned RenderPearl backend requires a pinned Fabric, Forge or NeoForge 26.3 target')
}
sourceSets.main.java.srcDir 'src/renderBackend/java'
sourceSets.main.resources.srcDir 'src/renderBackend/resources'
sourceSets.main.java.srcDir "src/renderBackendPlatform/${target.loader}/java"
apply from: 'gradle/render-backend-runtime.gradle'
sourceSets.test.java.srcDir 'src/renderBackendTest/java'
dependencies {
    implementation backendRuntimeJars
}
tasks.withType(JavaExec).configureEach {
    systemProperty 'org.lwjgl.system.stackSize', '1024'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    if (providers.gradleProperty('smokeClient').isPresent()||providers.gradleProperty('worldSmoke').isPresent()) {
        systemProperty 'overhaul.backend.smokeDirectory', file("run/${targetName}/overhaul-backend-smoke").absolutePath
    }
}
tasks.withType(Test).configureEach {
    systemProperty 'org.lwjgl.system.stackSize', '1024'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
tasks.named('test') { useJUnitPlatform { excludeTags 'backend-native' } }
['backendNativeTest','backendModelFmaTest'].each { taskName -> tasks.register(taskName, Test) {
    group = 'verification'
    description = 'Exercises the experimental RenderPearl backend against a real Vulkan device.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'backend-native' }
    systemProperty 'org.lwjgl.util.DebugAllocator', 'true'
    // Minecraft's process-owned RenderSystem cannot be initialized again after shutdown.
    forkEvery = 1
    maxParallelForks = 1
    // Avoid a fresh native JVM for fixture/helper classes that contain no tests.
    include '**/*Test.class'
    if (taskName == 'backendModelFmaTest') {
        description = 'Verifies model GPU parity in fresh JVMs with JOML fused math enabled.'
        systemProperty 'joml.useMathFma', 'true'
        filter { includeTestsMatching 'dev.overhaul.minecraft.model.*' }
        setIncludes(['dev/overhaul/minecraft/model/*Test.class'])
    }
} }
tasks.register('prepareBackendSmoke') {
    doLast {
        delete file("run/${targetName}/overhaul-backend-smoke/receipt.json")
        if (providers.gradleProperty('worldSmoke').isPresent()) {
            delete file("run/${targetName}/overhaul-terrain-smoke-latest.json")
            delete file("run/${targetName}/overhaul-occlusion-smoke-latest.json")
            delete file("run/${targetName}/overhaul-particle-smoke-latest.json")
            delete file("run/${targetName}/overhaul-weather-smoke-latest.json")
            delete file("run/${targetName}/overhaul-model-render-smoke-latest.json")
        }
    }
}
if (providers.gradleProperty('smokeClient').isPresent()||providers.gradleProperty('worldSmoke').isPresent()) {
    tasks.named('runClient') { dependsOn 'prepareBackendSmoke' }
}
tasks.register('verifyBackendSmoke') {
    group = 'verification'
    description = 'Verifies actual Overhaul game-window draws, image evidence and orderly backend close.'
    if (!providers.gradleProperty('smokeClient').isPresent()&&!providers.gradleProperty('worldSmoke').isPresent()) {
        throw new GradleException('Backend smoke requires -PsmokeClient=200 or -PworldSmoke')
    }
    dependsOn 'runClient'
    doLast {
        def report = file("run/${targetName}/overhaul-backend-smoke/receipt.json")
        if (!report.isFile()) throw new GradleException('The game backend produced no receipt')
        def receipt = new groovy.json.JsonSlurper().parse(report)
        if (receipt.status != 'PASS' || receipt.backend != 'Overhaul Vulkan' || !receipt.closed) {
            throw new GradleException("Game backend smoke failed: ${receipt}")
        }
        if (providers.gradleProperty('worldSmoke').isPresent()) {
            if (!receipt.terrainCompilerClosed || receipt.terrainActiveLeases != 0) throw new GradleException('Terrain compiler not closed before GPU shutdown')
            def terrainFile = file("run/${targetName}/overhaul-terrain-smoke-latest.json")
            if (!terrainFile.isFile()) throw new GradleException('Missing continuous terrain receipt')
            def terrain = new groovy.json.JsonSlurper().parse(terrainFile)
            if (terrain.status != 'PASS' || terrain.stages*.stage != ['initial','boundary','edited','reloaded']
                    || terrain.serverMutationRounds != 3 || terrain.reloadedCompilerGenerations != 1
                    || terrain.activePageLeases != 0 || terrain.retiredPageLeases != 0 || !terrain.retiredCompilersClosed) {
                throw new GradleException("Continuous terrain scenarios or teardown failed: ${terrain}")
            }
            terrain.stages.findAll { it.stage != 'initial' }.each { stage ->
                if (!stage.chestMetadata || stage.compiler.fluidBlocks < 1 || stage.finalClientStateBarrier <= 0
                        || stage.leftCompileStart <= stage.finalClientStateBarrier || stage.rightCompileStart <= stage.finalClientStateBarrier) {
                    throw new GradleException("Terrain snapshot is not newer than its final client-state barrier: ${stage}")
                }
            }
            ([terrain.finalCompiler] + terrain.retiredCompilers).each { generation ->
                if (generation.failed != 0 || generation.started != generation.completed
                        || generation.overhaulWorkerCompiles != generation.started || generation.constructorThreadCompiles != 0) {
                    throw new GradleException("Terrain compiler failed or escaped its workers: ${generation}")
                }
            }
            def nativeDraws = receipt.nativeDrawStatistics
            if (!receipt.terrainIndirectObserved || nativeDraws.indexedIndirectMultiRecordCalls < 1
                    || nativeDraws.instancedIndexedIndirectCalls < 1 || nativeDraws.maxIndexedIndirectBatch < 2) {
                throw new GradleException("Terrain did not use native indirect instanced batches: ${nativeDraws}")
            }
            def occlusionFile = file("run/${targetName}/overhaul-occlusion-smoke-latest.json")
            if (!occlusionFile.isFile()) throw new GradleException('Missing ordinary terrain occlusion receipt')
            def occlusion = new groovy.json.JsonSlurper().parse(occlusionFile)
            if (occlusion.status != 'PASS' || occlusion.stages*.stage != ['occlusion-wall','occlusion-open','occlusion-closed','occlusion-camera']) {
                throw new GradleException("Ordinary terrain occlusion scenarios failed: ${occlusion}")
            }
            occlusion.stages.each { stage ->
                def observation = stage.observation
                if (!observation.eligible || !observation.coherent || observation.lastCulled != stage.expectedCulled
                        || observation.frame <= stage.baselineFrame || observation.lastTestedFrame != observation.frame
                        || observation.frame != stage.culling.frames
                        || observation.lastMeshStart != stage.targetCompileStart || stage.targetCompileStart <= stage.finalClientStateBarrier) {
                    throw new GradleException("Occlusion did not observe the final coherent mesh: ${stage}")
                }
            }
            def particleFile = file("run/${targetName}/overhaul-particle-smoke-latest.json")
            if (!particleFile.isFile()) throw new GradleException('Missing ordinary particle receipt')
            def particles = new groovy.json.JsonSlurper().parse(particleFile)
            if (particles.status != 'PASS' || particles.stages*.stage != ['particles-normal','particles-oit','particles-reloaded']
                    || !receipt.particleStatistics.closed || !receipt.particleStatistics.pipelineCacheClosed
                    || receipt.particleStatistics.pendingGroups != 0 || receipt.particleStatistics.pipelineGenerations < 2) {
                throw new GradleException("Ordinary particle stages or resource lifetime failed: ${particles}")
            }
            particles.stages.each { stage ->
                def before = stage.before
                def after = stage.after
                def improved = stage.stage != 'particles-normal'
                if (!after.eligible || stage.spawnedFlame != 64 || stage.spawnedEndRod != 64
                        || stage.improvedTransparency != improved || after.maxLayerInstances < 64
                        || after.preparedParticles - before.preparedParticles < 128
                        || after.preparedInstanceBytes - before.preparedInstanceBytes != 56 * (after.preparedParticles - before.preparedParticles)
                        || after.normalCalls <= before.normalCalls || after.fallbackGroups != before.fallbackGroups
                        || (improved ? after.oitCalls <= before.oitCalls : after.oitCalls != before.oitCalls)) {
                    throw new GradleException("Ordinary particle path did not execute the required instance groups: ${stage}")
                }
            }
            def weatherFile = file("run/${targetName}/overhaul-weather-smoke-latest.json")
            if (!weatherFile.isFile()) throw new GradleException('Missing ordinary weather receipt')
            def weather = new groovy.json.JsonSlurper().parse(weatherFile)
            if (weather.status != 'PASS' || weather.stages*.stage != ['weather-rain','weather-rain-oit','weather-snow','weather-snow-oit','weather-reloaded','weather-mixed','weather-clear']
                    || !receipt.weatherStatistics.closed || !receipt.weatherStatistics.pipelineCacheClosed
                    || receipt.weatherStatistics.lastRainCount != 0 || receipt.weatherStatistics.lastSnowCount != 0
                    || receipt.weatherStatistics.pipelineGenerations < 2 || weather.pixelParity.status != 'PASS'
                    || weather.pixelParity.firstInstance != 1 || weather.pixelParity.instanceStride != 48) {
                throw new GradleException("Ordinary weather stages, parity or lifetime failed: ${weather}")
            }
            ['rain','snow'].each { type ->
                def pixels = weather.pixelParity[type]
                if (pixels.coveredPixels <= 1000 || pixels.partialAlphaPixels <= 1000 || pixels.distinctAlphaValues <= 8
                        || pixels.distinctColors <= 32 || pixels.differentPixels > 4 || pixels.instanceSliceOffset <= 0
                        || pixels.indirectSliceOffset <= 0 || !pixels.sourceOverwrittenAfterUpload || !pixels.signedLight) {
                    throw new GradleException("Weather pixel parity did not exercise the required coverage and instance data: ${pixels}")
                }
            }
            weather.stages.each { stage ->
                def before = stage.before
                def after = stage.after
                def improved = !['weather-rain','weather-snow'].contains(stage.stage)
                def snow = ['weather-snow','weather-snow-oit','weather-reloaded'].contains(stage.stage)
                if (stage.improvedTransparency != improved || stage.snow != snow
                        || stage.mixed != (stage.stage == 'weather-mixed') || stage.clear != (stage.stage == 'weather-clear')) {
                    throw new GradleException("Weather stage configuration differs from its required scenario: ${stage}")
                }
                if (!after.eligible || after.fallbackPreparations != before.fallbackPreparations) throw new GradleException("Weather capture used fallback geometry: ${stage}")
                if (stage.clear) {
                    if (after.lastRainCount != 0 || after.lastSnowCount != 0 || after.recordedRainInstances != before.recordedRainInstances
                            || after.recordedSnowInstances != before.recordedSnowInstances || stage.clientRainLevel > 0.001) throw new GradleException("Cleared weather retained instances: ${stage}")
                } else if (stage.mixed) {
                    def records = after.preparedRainInstances + after.preparedSnowInstances - before.preparedRainInstances - before.preparedSnowInstances
                    if (!stage.clientMixedMatchesServer || stage.clientRainBiomes <= 0 || stage.clientSnowBiomes <= 0
                            || stage.clientRainLevel < 0.9
                            || stage.clientRainBiomes + stage.clientSnowBiomes != 121 || after.lastRainCount != stage.clientRainBiomes
                            || after.lastSnowCount != stage.clientSnowBiomes || records < 121
                            || after.preparedInstanceBytes - before.preparedInstanceBytes != 48 * records) {
                        throw new GradleException("Mixed weather did not preserve server-sampled biome/column convergence: ${stage}")
                    }
                    ['Rain','Snow'].each { type ->
                        ['DEPTH_BOUNDS','TRANSMITTANCE','ACCUMULATE'].each { phase ->
                            if (after["oit${type}Calls"][phase] <= before["oit${type}Calls"][phase]) throw new GradleException("Mixed weather omitted ${type}/${phase}")
                        }
                    }
                } else {
                    def type = stage.snow ? 'Snow' : 'Rain'
                    def other = stage.snow ? 'Rain' : 'Snow'
                    def records = after["prepared${type}Instances"] - before["prepared${type}Instances"]
                    if (records < 121 || after["last${type}Count"] != 121 || after["last${other}Count"] != 0
                            || after.preparedInstanceBytes - before.preparedInstanceBytes != 48 * records
                            || stage.clientRainLevel < 0.9 || stage.clientPrecipitation != (stage.snow ? 'SNOW' : 'RAIN')) {
                        throw new GradleException("Weather extraction did not preserve the complete actual column set: ${stage}")
                    }
                    if (stage.improvedTransparency) {
                        ['DEPTH_BOUNDS','TRANSMITTANCE','ACCUMULATE'].each { phase ->
                            if (after["oit${type}Calls"][phase] <= before["oit${type}Calls"][phase]) throw new GradleException("Weather omitted OIT phase ${phase}")
                        }
                    } else if (after["normal${type}Calls"] <= before["normal${type}Calls"]) throw new GradleException('Weather omitted normal drawing')
                }
            }
            def modelsFile = file("run/${targetName}/overhaul-model-render-smoke-latest.json")
            if (!modelsFile.isFile()) throw new GradleException('Missing ordinary model receipt')
            def models = new groovy.json.JsonSlurper().parse(modelsFile)
            if (models.status != 'PASS' || models.instanceStride != 124
                    || models.stages*.stage != ['models-normal','models-animated','models-oit','models-reloaded','models-clear']
                    || !receipt.modelStatistics.closed || !receipt.modelStatistics.pipelineCacheClosed
                    || !receipt.modelStatistics.arenaClosed || receipt.modelStatistics.pendingGroups != 0
                    || !receipt.modelStatistics.staticGeometryClosed || !models.restoredFixture.playerModeRestored
                    || !models.restoredFixture.clientRestorationMatches || !models.restoredFixture.cleared
                    || receipt.modelStatistics.cachedModels != 0 || receipt.modelStatistics.cachedCubes != 0
                    || receipt.modelStatistics.cachedQuads != 0
                    || receipt.modelStatistics.pipelineGenerations < 2) {
                throw new GradleException("Ordinary model stages or resource lifetime failed: ${models}")
            }
            models.stages.each { stage ->
                def before = stage.before
                def after = stage.after
                def clear = stage.stage == 'models-clear'
                if (!stage.cameraAccepted || !stage.chestMetadataMatches || !after.eligible
                        || stage.improvedTransparency != !['models-normal','models-animated'].contains(stage.stage)
                        || after.fallbackGroups != before.fallbackGroups || after.fallbackSubmits != before.fallbackSubmits) {
                    throw new GradleException("Model capture did not preserve camera, configuration or owned preparation: ${stage}")
                }
                if (clear) {
                    if (!stage.fixture.cleared || stage.fixture.visibleClientPresent || stage.fixture.translucentClientPresent) {
                        throw new GradleException("Owned model fixtures remain after clear: ${stage}")
                    }
                } else {
                    [stage.serverInvisibilityBefore,stage.serverInvisibilityAfter].each { proof ->
                        if (!proof.active || !proof.infinite || !proof.hiddenFlag || proof.entityTicks <= 0 || proof.serverThread != 'Server thread') {
                            throw new GradleException("Translucent fixture lacks an actual ticked server invisibility effect: ${stage}")
                        }
                    }
                    if (stage.serverInvisibilityAfter.serverGameTime < stage.serverInvisibilityBefore.serverGameTime
                            || !stage.fixture.clientInvisibleFlag || stage.fixture.clientEffectListRequired
                            || (stage.stage != 'models-animated' && !stage.fixture.translucentVisibleToCamera)) {
                        throw new GradleException("Model capture does not match the actual effect synchronization contract: ${stage}")
                    }
                    def quads = after.preparedQuads - before.preparedQuads
                    if (quads <= 0 || after.preparedInstanceBytes - before.preparedInstanceBytes != 124 * quads
                            || after.recordedInstances <= before.recordedInstances || after.normalCalls <= before.normalCalls
                            || stage.pigModelSubmits <= 0 || stage.chestModelSubmits <= 0) {
                        throw new GradleException("Ordinary pig/chest features did not execute instanced records: ${stage}")
                    }
                    if (stage.stage == 'models-normal' && after.sortedQuads <= before.sortedQuads) throw new GradleException('Translucent model quad sorting did not execute')
                    if (stage.stage == 'models-animated' && (stage.maximumChestOpenness <= 0.8 || stage.maximumWalkPositionDelta <= 0.03 || stage.maximumWalkSpeed <= 0.01)) {
                        throw new GradleException('Actual chest/pig animation did not advance')
                    }
                    if (stage.stage == 'models-animated' && (!stage.chestGuiHidden || stage.clientMenuId != stage.openMenuProof.serverMenuId || stage.openMenuProof.serverOpenCount <= 0)) {
                        throw new GradleException('Animated chest did not preserve the actual open server menu')
                    }
                    if (stage.stage == 'models-animated' && (!stage.navigationAccepted || !stage.fixture.serverNavigation.accepted
                            || stage.fixture.serverNavigation.entityTicks <= stage.fixture.serverNavigation.enabledAtTick)) {
                        throw new GradleException('Model animation did not use accepted vanilla navigation after a physics tick')
                    }
                    if (['models-oit','models-reloaded'].contains(stage.stage)) {
                        ['DEPTH_BOUNDS','TRANSMITTANCE','ACCUMULATE'].each { phase ->
                            if (after.oitCalls[phase] <= before.oitCalls[phase]) throw new GradleException("Model omitted OIT phase ${phase}")
                        }
                    }
                }
            }
        }
    }
}
