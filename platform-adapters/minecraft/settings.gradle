pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}

def targets = new groovy.json.JsonSlurper().parse(file('targets.json'))
def targetName = providers.gradleProperty('target').getOrElse('fabric-26.3')
if (!targets.containsKey(targetName)) {
    throw new GradleException("Unknown target '${targetName}'; choose ${targets.keySet().join(', ')}")
}
rootProject.name = "overhaul-${targetName}"
rootProject.buildFileName = targets[targetName].script
