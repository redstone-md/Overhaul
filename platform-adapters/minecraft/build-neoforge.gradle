plugins {
    id 'net.neoforged.moddev' version '2.0.147'
}
apply from: 'gradle/common.gradle'

neoForge {
    version = target.loaderVersion
    mods { overhaul { sourceSet sourceSets.main } }
    // Query oracles import the real game classes; keep them outside the transformed JUnit bootstrap.
    if (target.minecraft == '26.3') addModdingDependenciesTo sourceSets.test
    if (['blazeBackend', 'overhaulBackend'].any { providers.gradleProperty(it).isPresent() }) {
        runs {
            client {
                client()
                def suffix = providers.gradleProperty('overhaulBackend').isPresent() ? '-backend' : ''
                gameDirectory = project.file("run/${targetName}${suffix}")
            }
        }
    }
}
if (providers.gradleProperty('packProfile').isPresent()) apply from: 'gradle/pack-client-profile.gradle'
